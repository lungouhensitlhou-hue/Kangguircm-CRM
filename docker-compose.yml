# Local/production-like stack:  cp .env.example .env  &&  docker compose up --build
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: rcm, POSTGRES_PASSWORD: rcm, POSTGRES_DB: rcm }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rcm"], interval: 3s, retries: 20 }
  web:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgres://rcm:rcm@db:5432/rcm" }
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    command: ["sh", "-c", "npm run db:migrate && npm run start -w @rcm/web"]
  worker:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgres://rcm:rcm@db:5432/rcm" }
    depends_on: { db: { condition: service_healthy } }
    command: ["npm", "run", "start", "-w", "@rcm/worker"]
    restart: unless-stopped
volumes: { dbdata: {} }

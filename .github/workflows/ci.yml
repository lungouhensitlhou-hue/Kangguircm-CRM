name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: rcm, POSTGRES_PASSWORD: rcm, POSTGRES_DB: rcm_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rcm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://rcm:rcm@localhost:5432/rcm_test
      DATABASE_URL: postgres://rcm:rcm@localhost:5432/rcm_test
      E2E_DATABASE_URL: postgres://rcm:rcm@localhost:5432/rcm_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y postgresql-client
      - run: npm run test:e2e
        env: { PGPASSWORD: rcm }
